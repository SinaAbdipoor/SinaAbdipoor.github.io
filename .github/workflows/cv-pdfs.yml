name: Build CV and resume PDFs
on:
  push:
    branches:
      - main
    paths:
      - "_data/cv.yaml"
      - "_bibliography/papers.bib"
      - "scripts/**"
  pull_request:
    paths:
      - "_data/cv.yaml"
      - "_bibliography/papers.bib"
      - "scripts/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the PDFs
        run: |
          pip install -r scripts/requirements.txt
          python scripts/render_cv.py build
          cp build/cv.pdf assets/pdf/Sina_Abdipoor_CV.pdf
          cp build/resume.pdf assets/pdf/Sina_Abdipoor_Resume.pdf
      - name: Commit the PDFs and redeploy the site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/pdf/Sina_Abdipoor_CV.pdf assets/pdf/Sina_Abdipoor_Resume.pdf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CV and resume PDFs"
          git push
          # Pushes made with the workflow token don't trigger other workflows.
          gh workflow run deploy.yml --ref main
